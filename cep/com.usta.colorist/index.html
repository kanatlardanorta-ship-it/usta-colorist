<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>USTA</title>
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <header>
      <div class="mark">U</div>
      <div>
        <strong>USTA</strong>
        <span>S-Log → TRT-2</span>
      </div>
    </header>
    <p class="lead">
      Broadcast Colors yok (patlayan ışığı keser). Look: soluk film, vinyet −8, highlight roll-off. Reklam canlılığı yok — belgesel.
    </p>
    <label class="look">
      Look
      <select id="look">
        <option value="belgesel" selected>Belgesel sinematik (TRT-2)</option>
        <option value="notr">Yayın Nötr</option>
        <option value="kultur">Kültür</option>
      </select>
    </label>
    <button id="grade" type="button">Analiz et ve grade et</button>
    <button id="frames" type="button" class="ghost">Temp kare klasörünü aç</button>
    <pre id="log"></pre>
    <script src="js/engine.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
